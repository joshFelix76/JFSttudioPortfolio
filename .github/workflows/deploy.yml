name: Build and deploy portfolio

on:
  # main 分支上影響網站產出的檔案變更時自動部署
  push:
    branches: [main]
    paths:
      - scripts/**
      - templates/**
      - assets/**
      - requirements.txt
      - .github/workflows/deploy.yml
  # 更新 PROJECTS_JSON Secret 不會觸發 workflow，請到 Actions 頁面手動執行
  workflow_dispatch:
  # 每週一 02:00（UTC）重新建置，同步私人 Repository 中更新過的 intro.md / cover.png
  schedule:
    - cron: "0 2 * * 1"

# 預設不給任何權限，各 Job 再明確宣告所需的最小權限
permissions: {}

# 同一時間只允許一個部署；不取消進行中的部署，避免網站停在中間狀態
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build site
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run tests
        run: python -m pytest -q

      - name: Build portfolio
        env:
          # 只在此步驟提供私人專案清單與唯讀 Token；程式不會將其寫入檔案或日誌
          PROJECTS_JSON: ${{ secrets.PROJECTS_JSON }}
          PRIVATE_REPOS_TOKEN: ${{ secrets.PRIVATE_REPOS_TOKEN }}
        run: python scripts/build_portfolio.py

      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
